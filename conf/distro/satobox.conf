############################################
# satobox distro Layer configuration
############################################

#include and overwrite default poky distro
include conf/distro/poky.conf
DISTRO = "satobox"
DISTRO_NAME = "satobox Linux"
INHERIT += "satobox-version"
DISTRO_VERSION := "${SATOBOX_DISTRO_VERSION}"
DISTRO_CODENAME = "Genesis"

IMAGE_VERSION_SUFFIX = "_${DISTRO_VERSION}"

SDK_VERSION="${DISTRO_VERSION}"

MAINTAINER = "Embetrix <ayoub.zaki@embetrix.com>"

TARGET_VENDOR = "-satobox"

# Override these in poky based distros
SATOBOX_DEFAULT_DISTRO_FEATURES = "${POKY_DEFAULT_DISTRO_FEATURES} systemd usrmerge acl xattr zeroconf"
SATOBOX_DEFAULT_EXTRA_RDEPENDS = "packagegroup-core-boot"
SATOBOX_DEFAULT_EXTRA_RRECOMMENDS = "kernel-module-af-packet"

DISTRO_EXTRA_RDEPENDS += " ${SATOBOX_DEFAULT_EXTRA_RDEPENDS}"
DISTRO_EXTRA_RRECOMMENDS += " ${SATOBOX_DEFAULT_EXTRA_RRECOMMENDS}"

DISTRO_FEATURES = "${SATOBOX_DEFAULT_DISTRO_FEATURES} ${DISTRO_FEATURES_DEFAULT}"
DISTRO_FEATURES:remove=" alsa irda pcmcia nfc nfs 3g debuginfod bluetooth multiarch vulkan x11 ptest"

# Use systemd as init manager
VIRTUAL-RUNTIME_init_manager = "systemd"

# Default u-boot-fw-utils
PREFERRED_PROVIDER_u-boot-fw-utils = "libubootenv"

# Overwrite machine config
include conf/machine/${MACHINE}-extra.conf


# Use custom image link
IMAGE_NAME = "${IMAGE_BASENAME}-${MACHINE}${IMAGE_VERSION_SUFFIX}"
IMAGE_LINK_NAME = "${IMAGE_BASENAME}"

# # Ship a kernel with bundled initramfs
# INITRAMFS_IMAGE  ?= "satobox-image-initramfs"
# INITRAMFS_IMAGE_NAME ?= "satobox-image-initramfs"
# INITRAMFS_IMAGE_BUNDLE ?= "1"

LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"

SDKMACHINE = "x86_64"

CLANGSDK = "1"

TOOLCHAIN_HOST_TASK:append = " nativesdk-libclang"

PACKAGE_CLASSES = "package_deb"

INHERIT += "rm_work"
