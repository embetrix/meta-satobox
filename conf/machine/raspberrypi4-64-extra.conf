# Allow overriding the default machine configuration from meta-raspberrypi
INITRAMFS_IMAGE_BUNDLE = "0"
INITRAMFS_IMAGE = ""

#RPI_USE_U_BOOT = "1"
ENABLE_UART = "1"
BOOT_DELAY = "0"
BOOT_DELAY_MS = "0"
DISABLE_SPLASH = "1"
GPU_FREQ = "250"
DISABLE_VC4GRAPHICS = "1"
ENABLE_I2C = "1"

CMDLINE:append = " loglevel=7 rw"

RPI_KERNEL_DEVICETREE += " \
    broadcom/bcm2711-rpi-4-b.dtb \
    broadcom/bcm2711-rpi-400.dtb \
    broadcom/bcm2711-rpi-cm4.dtb \
"

MACHINE_EXTRA_RRECOMMENDS += "\
    bcm2835 rpi-config userland u-boot-env \
    linux-firmware-rpidistro-bcm43455 \
    bluez-firmware-rpidistro-bcm4345c0-hcd \
"

IMAGE_BOOT_FILES += "${KERNEL_IMAGETYPE};${SDIMG_KERNELIMAGE}"

WKS_FILE_DEPENDS += " \
                    virtual/bootloader \
                    e2fsprogs-native \
                    "

WKS_FILES = "satobox.wks"
