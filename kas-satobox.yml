header:
  version: 11
machine: "raspberrypi5"
distro: satobox
target:
  - satobox-image
repos:
  # It's current revision will be used to perform the build.
  meta-satobox:
    path: meta-satobox
    layers:
      .:
  poky:
    url: "https://git.yoctoproject.org/git/poky"
    branch: scarthgap
    path: "layers"
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:
  meta-openembedded:
    url: "https://github.com/openembedded/meta-openembedded.git"
    branch: scarthgap
    path: "layers/meta-openembedded"
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-perl:
      meta-python:
      meta-multimedia:
      meta-filesystems:
      meta-webserver:
  meta-raspberrypi:
    url: "https://git.yoctoproject.org/git/meta-raspberrypi.git"
    branch: scarthgap
    path: "layers/meta-raspberrypi"
    patches:
      u-boot-loadaddress:
        repo: meta-satobox
        path: patches/0001-dont-enforce-u-boot-loadaddress.patch
      eeprom-enable-native-build:
        repo: meta-satobox
        path: patches/0002-rpi-eeprom-enable-native-build.patch
  meta-lts-mixins:
    url: "https://git.yoctoproject.org/meta-lts-mixins"
    branch: scarthgap/u-boot
    path: "layers/meta-lts-mixins"
  meta-clang:
    url: "https://github.com/kraj/meta-clang.git"
    branch: scarthgap
    path: "layers/meta-clang"
  meta-security:
    url: https://git.yoctoproject.org/meta-security
    branch: scarthgap
    path: "layers/meta-security"
    layers:
      .:
      meta-integrity:
  meta-tor:
    url: "https://github.com/embetrix/meta-tor.git"
    branch: scarthgap
    path: "layers/meta-tor"

env: 
    RPC_USER  : "satobox"
    RPC_PASSWD : "sat0b0x"
    PASSWORD : "r00t"
    BTC_CHAIN : "signet"

local_conf_header:
  standard: |
    CONF_VERSION = "2"
    ROOT_PASSWORD   = "${PASSWORD}"
    BITCOIND_RPC_USER   = "${RPC_USER}"
    BITCOIND_RPC_PASSWD = "${RPC_PASSWD}"
    DISTRO_FEATURES:append = " ${BTC_CHAIN}"