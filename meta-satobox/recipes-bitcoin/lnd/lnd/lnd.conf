[Application Options]
; Data directory for lnd
lnddir=/var/lnd

; Log output to syslog-compatible format
debuglevel=info

; Listen for gRPC connections
rpclisten=127.0.0.1:10009

; Listen for REST connections
restlisten=127.0.0.1:8080

; Listen for peer-to-peer connections
listen=0.0.0.0:9735

; Tor configuration for privacy — all connections routed through Tor
tor.active=true
tor.v3=true
tor.streamisolation=true

[Bitcoin]
bitcoin.active=true
bitcoin.signet=true
; bitcoin.mainnet=false
bitcoin.node=bitcoind

[Bitcoind]
bitcoind.rpchost=127.0.0.1:38332
bitcoind.rpccookie=/run/bitcoin/cookie


; Use RPC polling
bitcoind.rpcpolling=true
bitcoind.blockpollinginterval=5s

[autopilot]
autopilot.active=false
