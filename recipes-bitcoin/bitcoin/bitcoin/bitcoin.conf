pid=/run/bitcoin/bitcoind.pid
nodebuglogfile=1
datadir=/var/bitcoin
loglevel=info
proxy=127.0.0.1:9050
signer=/usr/bin/hwi

# Settings for reduced RAM/CPU/Storage
#dbcache=250
#maxmempool=200
#maxconnections=25
#prune=750

signet=1

[signet]
#walletdir=/var/wallets
listen=1
bind=127.0.0.1
port=38333

# RPC Settings for signet
rpcuser=satobox
rpcport=38332
rpcbind=127.0.0.1
rpcallowip=127.0.0.1

# generated using ./share/rpcauth/rpcauth.py satobox sat0b0x
rpcauth=satobox:c7eadc9121b2af62e92df69f1$3eecb49b2600f152f728a9f66ab38028e8c710a04ea06c69e4a2f291e7d6eee3
#rpcpassword=sat0b0x
rpccookiefile=/run/bitcoin/cookie
rpccookieperms=group

# RPC Settings
server=1
deprecatedrpc=warnings
