name: CI

permissions:
  contents: write

env:
  MACHINE: raspberrypi5

on:
  push:
    tags:
      - '*'

# env:
#   #BUILD_TYPE: Release

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: check
        run: |
          pwd
          git rev-parse --show-toplevel
          git describe --tags --always --dirty
          git tag --points-at HEAD || true

      - name: Build Testnet Image
        run: |
          pwd
          git rev-parse --show-toplevel
          git describe --tags --always --dirty
          git tag --points-at HEAD || true
          KAS_MACHINE=${{env.MACHINE}} kas-container build kas-satobox.yml

      - name: Build Mainnet Image
        run: |
          pwd
          git rev-parse --show-toplevel
          git describe --tags --always --dirty
          git tag --points-at HEAD || true
          BTC_CHAIN="mainnet" KAS_MACHINE=${{env.MACHINE}} kas-container build kas-satobox.yml

      - name: Archive Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: ${{github.workspace}}/build/tmp/deploy/images/*/**.wic*

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/tmp/deploy/images/${{env.MACHINE}}/satobox-image-*net-*_*.wic.bz2
            build/tmp/deploy/images/${{env.MACHINE}}/satobox-image-*net-*_*.wic.bmap
            build/tmp/deploy/images/${{env.MACHINE}}/satobox-image-*net-*_*.manifest
            build/tmp/deploy/images/${{env.MACHINE}}/satobox-image-*net-*_*.spdx.tar.zst
