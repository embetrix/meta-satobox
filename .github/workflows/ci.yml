name: CI

permissions:
  contents: write

on:
  push:
    tags:
      - '*'

# env:
#   #BUILD_TYPE: Release

jobs:
  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Build Testnet Image
        run: KAS_MACHINE=raspberrypi5 kas-container build kas-satobox.yml

      - name: Build Mainnet Image
        run: BTC_CHAIN="mainnet" KAS_MACHINE=raspberrypi5 kas-container build kas-satobox.yml

      - name: Archive Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: ${{github.workspace}}/build/tmp/deploy/images/*/**.wic*

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/tmp/deploy/images/*/satobox-image-*net*.wic.bz2
            build/tmp/deploy/images/*/satobox-image-*net*.wic.bmap
            build/tmp/deploy/images/*/satobox-image-*net*.manifest
